<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checking your browser…</title>
<style>
  html { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 80vh; margin: 0; padding: 1em;
    text-align: center;
  }
  .spinner {
    width: 2em; height: 2em; margin-bottom: 1em;
    border: 3px solid rgba(128, 128, 128, .3); border-top-color: currentColor;
    border-radius: 50%; animation: ag-spin 1s linear infinite;
  }
  @keyframes ag-spin { to { transform: rotate(360deg); } }
  #progress { opacity: .6; font-size: .85em; min-height: 1.2em; }
</style>
</head>
<body>
<div class="spinner" aria-hidden="true"></div>
<p id="msg">ページを確認しています… / Verifying your browser…</p>
<p id="progress"></p>
<noscript><p>JavaScriptとCookieを有効にして再読み込みしてください。<br>Please enable JavaScript and cookies, then reload.</p></noscript>
<script>
;(function () {
    "use strict"

    // Self-contained v2 challenge (see Module/AccessGate.php for the
    // protocol): the PoW parameters arrive in the `cv_gp` cookie -- set by
    // Apache on this very response, or by PHP when this page is served
    // inline with a 428. The token is minted entirely locally; this page
    // performs no requests, loads no scripts, and probes no roots.
    // The solver mirrors Client/AccessGate/access-gate.js; it is inlined
    // so this file stays a single static asset.

    var COOKIE = "cv_gate"
    var PARAMS_COOKIE = "cv_gp"

    var msg = document.getElementById("msg")
    var progress = document.getElementById("progress")

    function fail(text) {
        msg.textContent = text
        progress.textContent = ""
        var spinner = document.querySelector(".spinner")
        if (spinner) spinner.style.display = "none"
    }

    // --- SHA-256, synchronous pure JS (copy of access-gate.js) ---

    var K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
    ]

    function sha256Words(str) {
        var len = str.length
        var blocks = ((len + 8) >> 6) + 1
        var m = new Int32Array(blocks * 16)
        var i
        for (i = 0; i < len; i++) {
            m[i >> 2] |= (str.charCodeAt(i) & 0xff) << ((3 - (i & 3)) << 3)
        }
        m[i >> 2] |= 0x80 << ((3 - (i & 3)) << 3)
        m[blocks * 16 - 1] = len << 3

        var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a
        var h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19
        var w = sha256Words.w || (sha256Words.w = new Int32Array(64))

        for (var off = 0; off < m.length; off += 16) {
            var t, x, y
            for (t = 0; t < 16; t++) {
                w[t] = m[off + t]
            }
            for (t = 16; t < 64; t++) {
                x = w[t - 15]
                y = w[t - 2]
                w[t] = (w[t - 16] +
                    (((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3)) +
                    w[t - 7] +
                    (((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10))) | 0
            }
            var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7
            for (t = 0; t < 64; t++) {
                var t1 = (h +
                    (((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7))) +
                    ((e & f) ^ (~e & g)) + K[t] + w[t]) | 0
                var t2 = ((((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10))) +
                    ((a & b) ^ (a & c) ^ (b & c))) | 0
                h = g; g = f; f = e; e = (d + t1) | 0
                d = c; c = b; b = a; a = (t1 + t2) | 0
            }
            h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0
            h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0
        }
        return [h0, h1, h2, h3, h4, h5, h6, h7]
    }

    function wordsToHex(words) {
        var hex = ""
        for (var i = 0; i < words.length; i++) {
            hex += ("00000000" + (words[i] >>> 0).toString(16)).slice(-8)
        }
        return hex
    }

    function hasLeadingZeroBits(words, bits) {
        var full = bits >> 5
        for (var i = 0; i < full; i++) {
            if (words[i] !== 0) return false
        }
        var rest = bits & 31
        return rest === 0 || (words[full] >>> (32 - rest)) === 0
    }

    var sha256Usable = (function () {
        try {
            return wordsToHex(sha256Words("abc")) ===
                "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
        } catch (error) {
            return false
        }
    })()

    async function solve(prefix, bits, onProgress) {
        var SLICE = 16384
        for (var nonce = 0; ; ) {
            var end = nonce + SLICE
            for (; nonce < end; nonce++) {
                if (hasLeadingZeroBits(sha256Words(prefix + nonce), bits)) return nonce
            }
            if (onProgress) onProgress(nonce)
            await new Promise(function (resolve) { setTimeout(resolve, 0) })
        }
    }

    async function solveSubtle(prefix, bits, onProgress) {
        var encoder = new TextEncoder()
        var fullBytes = bits >> 3
        var restBits = bits & 7
        for (var nonce = 0; ; nonce++) {
            var digest = new Uint8Array(
                await crypto.subtle.digest("SHA-256", encoder.encode(prefix + nonce))
            )
            var ok = true
            for (var i = 0; i < fullBytes; i++) {
                if (digest[i] !== 0) { ok = false; break }
            }
            if (ok && restBits > 0 && (digest[fullBytes] >> (8 - restBits)) !== 0) {
                ok = false
            }
            if (ok) return nonce
            if (onProgress && (nonce & 255) === 0) onProgress(nonce)
        }
    }

    // --- cookies ---

    function readCookie(name) {
        var parts = document.cookie.split("; ")
        for (var i = 0; i < parts.length; i++) {
            if (parts[i].indexOf(name + "=") === 0) {
                return parts[i].slice(name.length + 1)
            }
        }
        return null
    }

    function readParams() {
        var raw = readCookie(PARAMS_COOKIE)
        if (!raw) return null
        var f = raw.split("|")
        if (f.length !== 4) return null
        var bits = parseInt(f[1], 10)
        var ttl = parseInt(f[2], 10)
        if (!f[0] || !(bits >= 1 && bits <= 64) || !(ttl >= 60) || !/^[0-9a-f]{8}$/.test(f[3])) {
            return null
        }
        return { ip: f[0], bits: bits, ttl: ttl, beacon: f[3] }
    }

    // --- flow ---

    async function run() {
        if (!sha256Usable && !(window.crypto && window.crypto.subtle && window.TextEncoder)) {
            fail("このブラウザは対応していません。 / This browser is not supported.")
            return
        }
        if (!navigator.cookieEnabled) {
            fail("Cookieを有効にして再読み込みしてください。 / Please enable cookies and reload.")
            return
        }
        var params = readParams()
        if (params === null) {
            // No cv_gp: this static response was served without the header
            // module. Plant a placeholder that passes the prefilter's
            // `cv_gate=v2~` prefix sieve so the next request reaches PHP,
            // whose 428 serves this page again WITH cv_gp. A present
            // cv_gate without cv_gp means that retry already happened --
            // stop, don't loop.
            if (readCookie(COOKIE) !== null) {
                fail("確認サービスに接続できませんでした。しばらくして再読み込みしてください。 / Could not reach the verification service. Please reload later.")
                return
            }
            document.cookie = COOKIE + "=v2~0; path=/; max-age=60; SameSite=Lax" +
                (location.protocol === "https:" ? "; Secure" : "")
            location.reload()
            return
        }
        var expiry = Math.floor(Date.now() / 1000) + params.ttl
        var prefix = "v2~" + expiry + "~" + params.bits + "~" + params.beacon + "~" + params.ip + "~"
        var onProgress = function (attempts) {
            progress.textContent = attempts + " …"
        }
        var nonce = sha256Usable
            ? await solve(prefix, params.bits, onProgress)
            : await solveSubtle(prefix, params.bits, onProgress)
        var expirySec = Math.max(60, expiry - Math.floor(Date.now() / 1000))
        document.cookie = COOKIE + "=" + prefix + nonce +
            "; path=/; max-age=" + expirySec + "; SameSite=Lax" +
            (location.protocol === "https:" ? "; Secure" : "")
        if (readCookie(COOKIE) === null) {
            fail("Cookieを有効にして再読み込みしてください。 / Please enable cookies and reload.")
            return
        }
        location.reload()
    }

    run()
})()
</script>
</body>
</html>
